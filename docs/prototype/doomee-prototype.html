:root{--y:#FFD43B;--k:#202124;--bg:#ECECE7}
html,body{margin:0;background:var(--bg);font-family:Manrope,Inter,system-ui,sans-serif;color:var(--k)}
.shell-bar{position:sticky;top:0;z-index:50;background:#FFFFFF;border-bottom:1px solid #E4E4DF;display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:10px 16px}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;letter-spacing:.06em;margin-right:8px}
.brand i{width:28px;height:28px;border-radius:8px;background:var(--y);display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:800;letter-spacing:0}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tabs button{min-height:40px;border:none;border-radius:12px;padding:0 14px;background:#F5F5F2;font-family:inherit;font-size:14px;font-weight:700;color:var(--k);cursor:pointer}
.tabs button[aria-current="page"]{background:var(--k);color:#FFFFFF}
.tag{font-size:12px;font-weight:700;color:#5F6368;margin-left:auto}
.stage{display:flex;justify-content:center;padding:28px 16px 48px}
.phone{width:390px;height:844px;border-radius:44px;overflow:hidden;box-shadow:0 0 0 10px #202124,0 24px 60px rgba(0,0,0,.18);background:#F5F5F2;flex-shrink:0}
.desktop{width:100%}
.stage.is-desktop{padding:0}
@media (max-width:440px){.phone{width:100%;height:auto;min-height:844px;border-radius:0;box-shadow:none}.stage{padding:0}}

var ORDER = ["Login","Main","Planning","Checkout","Performance","Profile","Management"];

/* ---------- Mini moteur de rendu des écrans ---------- */
function DCLogic(props) { this.props = props || {}; this.state = {}; }
DCLogic.prototype.setState = function (p) {
  var next = typeof p === 'function' ? p(this.state, this.props) : p;
  this.state = Object.assign({}, this.state, next);
  scheduleRender();
};
DCLogic.prototype.forceUpdate = function () { scheduleRender(); };

var current = null, currentId = null, tplCache = {}, pending = false;
var HOLE = /\{\{\s*([^}]+?)\s*\}\}/g, WHOLE = /^\s*\{\{\s*([^}]+?)\s*\}\}\s*$/;

function lookup(expr, scopes) {
  expr = expr.trim();
  if (expr === 'true') return true;
  if (expr === 'false') return false;
  if (/^-?\d+(\.\d+)?$/.test(expr)) return Number(expr);
  if (/^'.*'$/.test(expr)) return expr.slice(1, -1);

}
function interp(str, scopes) {

}

function processChildren(parent, scopes, out) {

}
function processNode(node, scopes, out) {

    } else {

      var as = node.getAttribute('as') || 'item';
      for (var i = 0; i < list.length; i++) {

}
