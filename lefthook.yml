pre-commit:
  parallel: true
  commands:
    biome:
      glob: '*.{ts,tsx,js,json}'
      run: pnpm biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    typecheck:
      run: pnpm typecheck
pre-push:
  commands:
    boundaries:
      run: pnpm check:boundaries
    i18n:
      run: pnpm check:i18n
