pre-commit:
  parallel: true
  commands:
    biome:
      glob: '*.{ts,tsx,js,json}'
      run: pnpm biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    typecheck:
      run: pnpm typecheck
pre-push:
  parallel: true
  commands:
    # Lint the WHOLE tree here, not just staged files: a formatting drift in an
    # untouched file still turns CI red, and finding that out on the runner
    # costs a round trip.
    lint:
      run: pnpm lint
    boundaries:
      run: pnpm check:boundaries
    i18n:
      run: pnpm check:i18n
