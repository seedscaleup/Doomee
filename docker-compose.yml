# Local development services. Mirrors production shape without binding us
# to any provider (ADR-021): plain PostgreSQL, plain S3 API.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: doomee
      POSTGRES_PASSWORD: doomee
      POSTGRES_DB: doomee
    ports: ['5432:5432']
    volumes: ['doomee-pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U doomee -d doomee']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: doomee
      MINIO_ROOT_PASSWORD: doomee-secret
    ports: ['9000:9000', '9001:9001']
    volumes: ['doomee-minio:/data']

volumes:
  doomee-pgdata:
  doomee-minio:
